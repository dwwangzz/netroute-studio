name: 正式发布

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本（例如 v1.0.3）
        required: true
        type: string
      prerelease:
        description: 标记为预发布版本
        required: true
        default: false
        type: boolean

jobs:
  build-release:
    name: 构建、测试并发布
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 计算版本
        id: version
        shell: pwsh
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          $releaseVersion = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME } else { $env:MANUAL_VERSION }
          if ($releaseVersion -notmatch '^v(\d+\.\d+\.\d+)([.-][0-9A-Za-z.-]+)?$') {
            throw "版本号必须使用 v1.0.0 或 v1.0.0-beta.1 格式。"
          }
          $assemblyVersion = $releaseVersion.Substring(1)
          $numericVersion = [regex]::Match($releaseVersion, '^v(\d+\.\d+\.\d+)').Groups[1].Value
          "release_version=$releaseVersion" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "numeric_version=$numericVersion.0" >> $env:GITHUB_OUTPUT
          "package_name=NetRouteStudio-$releaseVersion-win-x64-self-contained" >> $env:GITHUB_OUTPUT

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 恢复依赖
        run: dotnet restore NetRouteStudio.sln --configfile NuGet.Config --runtime win-x64 --disable-parallel

      - name: Release 构建
        run: >-
          dotnet build NetRouteStudio.sln --configuration Release --no-restore --maxcpucount:1
          -p:Version=${{ steps.version.outputs.assembly_version }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric_version }}
          -p:FileVersion=${{ steps.version.outputs.numeric_version }}
          -p:InformationalVersion=${{ steps.version.outputs.assembly_version }}
          -p:IncludeSourceRevisionInInformationalVersion=false

      - name: 运行稳定测试
        run: dotnet test NetRouteStudio.sln --configuration Release --no-build --maxcpucount:1 --filter "Category!=Integration"

      - name: 发布自包含程序
        run: >-
          dotnet publish src/NetRouteStudio.App/NetRouteStudio.App.csproj
          --configuration Release --runtime win-x64 --self-contained true --no-restore
          --output artifacts/publish -p:Version=${{ steps.version.outputs.assembly_version }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric_version }}
          -p:FileVersion=${{ steps.version.outputs.numeric_version }}
          -p:InformationalVersion=${{ steps.version.outputs.assembly_version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:DebugType=None -p:DebugSymbols=false

      - name: 打包免安装版
        shell: pwsh
        run: |
          $zip = "artifacts/${{ steps.version.outputs.package_name }}.zip"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $zip

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 生成安装程序
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path "artifacts/publish").Path
          $outputDir = (Resolve-Path "artifacts").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.assembly_version }}" `
            "/DNumericVersion=${{ steps.version.outputs.numeric_version }}" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "installer\NetRouteStudio.iss"

      - name: 生成 SHA-256
        shell: pwsh
        run: |
          $files = @(
            "artifacts/${{ steps.version.outputs.package_name }}.zip",
            "artifacts/NetRouteStudio-v${{ steps.version.outputs.assembly_version }}-win-x64-setup.exe"
          )
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))" | Set-Content -Encoding ascii "$file.sha256"
          }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_version }}
          name: NetRoute Studio ${{ steps.version.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || contains(steps.version.outputs.release_version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/${{ steps.version.outputs.package_name }}.zip
            artifacts/${{ steps.version.outputs.package_name }}.zip.sha256
            artifacts/NetRouteStudio-v${{ steps.version.outputs.assembly_version }}-win-x64-setup.exe
            artifacts/NetRouteStudio-v${{ steps.version.outputs.assembly_version }}-win-x64-setup.exe.sha256
